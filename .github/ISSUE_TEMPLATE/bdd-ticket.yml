name: BDD Ticket
description: File a defect or feature as a Given/When/Then scenario with evidence.
title: "[BDD] "
labels:
  - bdd
  - needs:triage
body:
  - type: markdown
    attributes:
      value: |
        Fill every required field with real content — not placeholder text. The
        intake gate validates this shape deterministically before the queue can
        see the ticket.
  - type: dropdown
    id: org
    attributes:
      label: Org
      description: Which org/site this ticket is about.
      options:
        - OneShotMN
        - Voices of Power
        - 10K Lakes Cannabis
        - Good Neighbor
        - Bella
        - Other/new-org
    validations:
      required: true
  - type: textarea
    id: scenario_given
    attributes:
      label: Given
      description: The starting state. Real data shapes, not "some data".
      placeholder: "Given a user with an expired session token..."
    validations:
      required: true
  - type: textarea
    id: scenario_when
    attributes:
      label: When
      description: The action taken.
      placeholder: "When they submit the checkout form..."
    validations:
      required: true
  - type: textarea
    id: scenario_then
    attributes:
      label: Then
      description: The observable outcome that should happen.
      placeholder: "Then they are redirected to /login with their cart preserved..."
    validations:
      required: true
  - type: textarea
    id: but_instead
    attributes:
      label: But instead
      description: What actually happens today, if this is a defect. Leave blank for a feature ticket with no defect yet.
      placeholder: "But instead they see a 500 error..."
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Real output, a log line, an API response — or "none yet".
      placeholder: "Paste the failing command's output, a screenshot link, or an API response here."
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - urgent
        - high
        - medium
        - low
    validations:
      required: true
  - type: checkboxes
    id: done_when
    attributes:
      label: Done when
      description: The TDD gates this ticket must clear before it's closed.
      options:
        - label: A failing test exists that demonstrates the gap
          required: false
        - label: The test passes after the fix
          required: false
        - label: It runs under the repo's normal test command (no bespoke runner)
          required: false
