name: build

# Build stage of the pipeline. Dispatched by the automation's build-queue consumer with everything it needs
# as inputs; this file carries no organization, repository, label, person or host of its own.
#
# Properties that keep this safe:
#  - workflow_dispatch is the only door; the dispatcher checks for an existing PR on the deterministic
#    branch before dispatching, and the concurrency group below serializes per issue.
#  - The dispatch is a claim, not a fact: the first step re-reads the issue and refuses to build if the
#    hold label has come back since the queue entry was made.
#  - The App authors the branch and the PR, never the Actions token, so CI and the merge stage see them.
#  - The job never merges and never reviews; approval belongs to the configured approvers.

on:
  workflow_dispatch:
    inputs:
      repo:          { description: "owner/name of the repository to build in", type: string, required: true }
      issue:         { description: "issue number", type: string, required: true }
      branch:        { description: "deterministic branch name for this issue", type: string, required: true }
      hold_label:    { description: "label that means 'not approved'", type: string, required: true }
      pr_open_label: { description: "label applied to the issue when the PR opens", type: string, required: true }
      reviewers:     { description: "comma-separated logins to request review from", type: string, required: true }
      runner_label:  { description: "self-hosted runner label", type: string, required: true }
      spec_sentinel: { description: "text that identifies the specification comment", type: string, required: true }
      agent:         { description: "coding agent command available on the runner", type: string, required: true }
      mode:          { description: "build (new work from the spec), feedback (address review comments on the open PR) or repair (fix a failing check on the open PR)", type: string, required: false, default: "build" }

concurrency:
  group: build-${{ inputs.repo }}-${{ inputs.issue }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 60
    steps:
      - name: Mint the App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ONESHOT_PR_APP_ID }}
          private-key: ${{ secrets.ONESHOT_PR_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Re-read approval at the moment of use
        id: gate
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ inputs.repo }}
          ISSUE: ${{ inputs.issue }}
          HOLD: ${{ inputs.hold_label }}
        run: |
          set -euo pipefail
          json="$RUNNER_TEMP/issue.json"
          gh issue view "$ISSUE" --repo "$REPO" --json labels,title,state > "$json"
          if jq -e --arg h "$HOLD" '[.labels[].name] | any(. == $h)' "$json" > /dev/null; then
            echo "::error::Issue #$ISSUE carries the hold label again; approval was withdrawn after dispatch. Nothing written."; exit 1; fi
          if [ "$(jq -r .state "$json")" != "OPEN" ]; then echo "::error::Issue #$ISSUE is not open."; exit 1; fi
          echo "title=$(jq -r .title "$json")" >> "$GITHUB_OUTPUT"

      - name: Fresh checkout of the target repository
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ inputs.repo }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/src"; rm -rf "$dir"
          git -c credential.helper= -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')" clone --quiet "https://github.com/$REPO.git" "$dir"
          cd "$dir"
          git config user.name "${{ github.actor }}"; git config user.email "${{ github.actor }}@users.noreply.github.com"
          git config "http.https://github.com/.extraheader" "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          default=$(git symbolic-ref --short refs/remotes/origin/HEAD | sed 's#origin/##')
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then git checkout -B "$BRANCH" "origin/$BRANCH"; else git checkout -B "$BRANCH" "origin/$default"; fi
          echo "default=$default" >> "$GITHUB_ENV"; echo "src=$dir" >> "$GITHUB_ENV"

      - name: Read the specification, or the review feedback in feedback mode
        id: spec
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ inputs.repo }}
          ISSUE: ${{ inputs.issue }}
          BRANCH: ${{ inputs.branch }}
          SENTINEL: ${{ inputs.spec_sentinel }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          gh issue view "$ISSUE" --repo "$REPO" --json body --jq .body > "$RUNNER_TEMP/issue.md"
          gh api "repos/$REPO/issues/$ISSUE/comments" --paginate --jq '[.[] | select(.body | contains(env.SENTINEL))] | last | .body // empty' > "$RUNNER_TEMP/spec.md"
          if [ "$MODE" = "repair" ]; then
            pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number')
            [ -n "$pr" ] || { echo "::error::No open PR on $BRANCH to repair."; exit 1; }
            sha=$(gh pr view "$pr" --repo "$REPO" --json headRefOid --jq .headRefOid)
            { echo "# Failing checks on pull request #$pr (head $sha)"; echo
              gh api "repos/$REPO/commits/$sha/check-runs?per_page=100" --jq '.check_runs[] | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral") | "## \(.name): \(.conclusion)\nrun: \(.html_url)\n"'
              for rid in $(gh api "repos/$REPO/actions/runs?head_sha=$sha&status=failure&per_page=10" --jq '.workflow_runs[].id'); do
                echo "### Failed log excerpt, run $rid"; echo '```'; gh run view "$rid" --repo "$REPO" --log-failed 2>/dev/null | grep -v -E '^\s*$' | tail -n 200 | cut -c1-400; echo '```'; done
            } > "$RUNNER_TEMP/feedback.md"
            echo "pr=$pr" >> "$GITHUB_OUTPUT"
          elif [ "$MODE" = "feedback" ]; then
            pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number')
            [ -n "$pr" ] || { echo "::error::No open PR on $BRANCH to take feedback for."; exit 1; }
            { echo "# Review feedback on pull request #$pr"; echo
              gh api "repos/$REPO/pulls/$pr/reviews" --paginate --jq '.[] | select(.body != "" and .body != null) | "## Review by \(.user.login) (\(.state))\n\(.body)\n"'
              gh api "repos/$REPO/pulls/$pr/comments" --paginate --jq '.[] | "## Comment by \(.user.login) on \(.path) line \(.line // .original_line)\n\(.body)\n"'
              gh api "repos/$REPO/issues/$pr/comments" --paginate --jq '.[] | select(.user.type != "Bot") | "## Conversation comment by \(.user.login)\n\(.body)\n"'
            } > "$RUNNER_TEMP/feedback.md"
            [ "$(wc -c < "$RUNNER_TEMP/feedback.md")" -gt 60 ] || { echo "::error::No review feedback found on PR #$pr."; exit 1; }
            echo "pr=$pr" >> "$GITHUB_OUTPUT"
          else
            [ -s "$RUNNER_TEMP/spec.md" ] || { echo "::error::No specification comment found on #$ISSUE; the triage step has not run."; exit 1; }
          fi

      - name: Build the ticket with the coding agent
        working-directory: ${{ env.src }}
        env:
          REPO: ${{ inputs.repo }}
          ISSUE: ${{ inputs.issue }}
          AGENT: ${{ inputs.agent }}
          MODE: ${{ inputs.mode }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          cat > "$RUNNER_TEMP/prompt.md" <<'PROMPT'
          You are building a GitHub issue in a fresh checkout on the branch this ticket builds on. Work here and nowhere else.

          The issue body is in the file named by ISSUE_FILE and the approved specification comment is in the file named by SPEC_FILE (both paths are given below). Follow the specification; where it is silent, make the smallest change that satisfies the ticket.

          Write the failing test first, run it, then make it pass. Run the repository's own lint, typecheck, test and build commands if they exist and leave them green. Commit on the current branch with a message that says what changed and why. Do not push and do not open a pull request; the workflow does that after you stop.
          PROMPT
          if [ "$MODE" = "repair" ]; then
            cat > "$RUNNER_TEMP/prompt.md" <<'PROMPT'
          You are repairing a failing check on an open pull request, in a fresh checkout of that PR's branch.

          The original issue is in the file named by ISSUE_FILE, the approved specification in SPEC_FILE, and the failing checks with their log excerpts in FEEDBACK_FILE. Find the cause of the failure and decide where the fix belongs:

          - If the fix belongs in this repository: make it here, run the repository's own lint, typecheck, test and build commands, leave them green, and commit on the current branch with a message that names the failing check and what you changed. Do not push.
          - If the fix requires a change in a different repository (a reusable workflow, a shared package, a template this repository consumes): change nothing on this branch. Instead open one issue in that repository with `gh issue create`, quoting the failing check, the run link and the reason, and print its URL as the last line of your output. Do not commit anything here.
          PROMPT
            printf '\nFEEDBACK_FILE=%s' "$RUNNER_TEMP/feedback.md" >> "$RUNNER_TEMP/prompt.md"
          elif [ "$MODE" = "feedback" ]; then
            cat > "$RUNNER_TEMP/prompt.md" <<'PROMPT'
          You are addressing review feedback on an open pull request, in a fresh checkout of that PR's branch. Work here and nowhere else.

          The original issue is in the file named by ISSUE_FILE, the approved specification in SPEC_FILE, and every review comment in FEEDBACK_FILE. Address each piece of feedback: change what the reviewer asked for, keep the tests green, add or adjust tests where the feedback implies behaviour. Commit on the current branch with a message that says which feedback each change answers. Do not push and do not open anything; the workflow pushes after you stop.
          PROMPT
            printf '\nFEEDBACK_FILE=%s' "$RUNNER_TEMP/feedback.md" >> "$RUNNER_TEMP/prompt.md"
          fi
          printf '\nISSUE_FILE=%s\nSPEC_FILE=%s\nREPO=%s\nISSUE=%s\n' "$RUNNER_TEMP/issue.md" "$RUNNER_TEMP/spec.md" "$REPO" "$ISSUE" >> "$RUNNER_TEMP/prompt.md"
          "$AGENT" -p "$(cat "$RUNNER_TEMP/prompt.md")" --permission-mode acceptEdits --max-turns 60 \
            --add-dir "$RUNNER_TEMP" \
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(npm ci:*),Bash(npm install:*),Bash(npm run:*),Bash(npm test:*),Bash(npx:*),Bash(node:*),Bash(git add:*),Bash(git commit:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(ls:*),Bash(cat:*)$([ "$MODE" = "repair" ] && printf ',Bash(gh issue create:*),Bash(gh issue view:*),Bash(gh api:*)')" \
            2>&1 | tail -c 20000

      - name: Push the branch and open the pull request
        working-directory: ${{ env.src }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ inputs.repo }}
          ISSUE: ${{ inputs.issue }}
          BRANCH: ${{ inputs.branch }}
          TITLE: ${{ steps.gate.outputs.title }}
          REVIEWERS: ${{ inputs.reviewers }}
          PR_OPEN: ${{ inputs.pr_open_label }}
        run: |
          set -euo pipefail
          if [ -z "$(git log "origin/$default..HEAD" --oneline)" ] || { { [ "${{ inputs.mode }}" = "feedback" ] || [ "${{ inputs.mode }}" = "repair" ]; } && [ -z "$(git log "origin/$BRANCH..HEAD" --oneline 2>/dev/null)" ]; }; then
            if [ "${{ inputs.mode }}" = "repair" ]; then
              gh pr comment "$BRANCH" --repo "$REPO" --body "Repair run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} changed nothing on this branch: the cause was judged to live outside this repository (an issue was opened there if the agent found one; see the run log) or could not be fixed automatically. A person decides next."
            else
              gh issue comment "$ISSUE" --repo "$REPO" --body "Build run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} committed nothing; the ticket needs a person. Its approval stands."
            fi
            exit 0; fi
          git push -u origin "$BRANCH"
          if [ "${{ inputs.mode }}" = "feedback" ] || [ "${{ inputs.mode }}" = "repair" ]; then
            what="Addressed the review feedback"; [ "${{ inputs.mode }}" = "repair" ] && what="Repaired the failing check"
            gh pr comment "$BRANCH" --repo "$REPO" --body "$what in a new commit on this branch. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Branch protection dismisses an earlier approval when a commit lands, so review has been requested again."
            gh pr edit "$BRANCH" --repo "$REPO" --add-reviewer "$REVIEWERS" >/dev/null || true
            exit 0
          fi
          if ! gh pr view "$BRANCH" --repo "$REPO" >/dev/null 2>&1; then
            run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            issue_url="https://github.com/$REPO/issues/$ISSUE"
            why=$(awk 'NF{print; n++} n>=3{exit}' "$RUNNER_TEMP/issue.md" | tr '\n' ' ')
            commits=$(git log "origin/$default..HEAD" --format='- %s%n%b' | sed '/^$/d')
            stat=$(git diff --stat "origin/$default..HEAD" | sed 's/^/    /')
            tests=$(node -e 'const p=require("./package.json").scripts||{}; console.log(["lint","typecheck","test","build"].filter(k=>p[k]).map(k=>"npm run "+k).join(", "))' 2>/dev/null || true)
            body=$(printf '## Why\n\n%s\n\n**Ticket:** %s (#%s)\n\n## What changed\n\n%s\n\nFiles:\n\n%s\n\n## How to verify\n\nThe build ran the repository'"'"'s own checks before committing%s. Required status checks run on this PR. Build run: %s\n\n## Risk and rollback\n\nScoped to the files above; nothing outside the ticket was touched. Revert this squash commit to roll back.\n\nCloses #%s' "$why" "$issue_url" "$ISSUE" "$commits" "$stat" "${tests:+ ($tests)}" "$run_url" "$ISSUE")
            gh pr create --repo "$REPO" --head "$BRANCH" --base "$default" --title "$TITLE (#$ISSUE)" --body "$body" --reviewer "$REVIEWERS" --assignee "$REVIEWERS"
          fi
          gh api -X POST "repos/$REPO/issues/$ISSUE/labels" -f "labels[]=$PR_OPEN" >/dev/null   # creates the label if the repo lacks it
          gh issue comment "$ISSUE" --repo "$REPO" --body "Pull request opened: $(gh pr view "$BRANCH" --repo "$REPO" --json url --jq .url)"

      - name: Report a failed build on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ inputs.repo }}
          ISSUE: ${{ inputs.issue }}
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body "Build failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. The issue stays approved; fix the cause and it is retried on the next sweep." || true
