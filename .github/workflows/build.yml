name: build
run-name: "${{ inputs.mode }} ${{ inputs.repo }}#${{ inputs.issue }}"

# Build stage of the pipeline. Dispatched by the automation's build-queue consumer with everything it needs
# as inputs; this file carries no organization, repository, label, person or host of its own.
#
# Properties that keep this safe:
#  - workflow_dispatch is the only door; the dispatcher checks for an existing PR on the deterministic
#    branch before dispatching, and the concurrency group below serializes per issue.
#  - The dispatch is a claim, not a fact: the first step re-reads the issue and refuses to build if the
#    hold label has come back since the queue entry was made.
#  - The App authors the branch and the PR, never the Actions token, so CI and the merge stage see them.
#  - The job never merges and never reviews; approval belongs to the configured approvers.

on:
  workflow_dispatch:
    inputs:
      repo:          { description: "owner/name of the repository to build in", type: string, required: true }
      issue:         { description: "issue number", type: string, required: true }
      branch:        { description: "deterministic branch name for this issue", type: string, required: true }
      hold_label:    { description: "label that means 'not approved'", type: string, required: true }
      pr_open_label: { description: "label applied to the issue when the PR opens", type: string, required: true }
      reviewers:     { description: "comma-separated logins to request review from", type: string, required: true }
      runner_label:  { description: "self-hosted runner label", type: string, required: true }
      spec_sentinel: { description: "text that identifies the specification comment", type: string, required: true }
      agent:         { description: "coding agent command available on the runner", type: string, required: true }
      mode:          { description: "build (new work from the spec), feedback (address review comments on the open PR) or repair (fix a failing check on the open PR)", type: string, required: false, default: "build" }
      max_turns:     { description: "turn cap for the coding agent", type: string, required: true }
      timeout_minutes: { description: "job timeout in minutes", type: string, required: true }
      claim_minutes: { description: "minutes before an approved issue with no PR is released to build again", type: string, required: true }
      max_attempts:  { description: "automatic build attempts per issue before the hold label comes back", type: string, required: true }
      run_id:        { description: "pipeline-repair mode: id of the failed build run to repair", type: string, required: false, default: "" }
      repair_label:  { description: "pipeline-repair mode: label put on the repair PR", type: string, required: false, default: "" }
      operator_repo: { description: "pipeline-repair mode: repository where defects the agent cannot fix are filed", type: string, required: false, default: "" }
      auto_merge:    { description: "pipeline-repair mode: true merges the repair PR without a review", type: string, required: false, default: "false" }
      target_repo:   { description: "pipeline-repair mode: owner/name of the repository whose ticket the failed run was building", type: string, required: false, default: "" }

concurrency:
  group: build-${{ inputs.repo }}-${{ inputs.issue }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    steps:
      - name: Mint the App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ONESHOT_PR_APP_ID }}
          private-key: ${{ secrets.ONESHOT_PR_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Re-read approval at the moment of use
        id: gate
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ inputs.repo }}
          ISSUE: ${{ inputs.issue }}
          HOLD: ${{ inputs.hold_label }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.mode }}" = "pipeline-repair" ]; then
            # The claim here is a failed run of this workflow that was not itself a repair (no recursion).
            r=$(gh run view "${{ inputs.run_id }}" --repo "${{ github.repository }}" --json conclusion,displayTitle,workflowName)
            [ "$(echo "$r" | jq -r .conclusion)" = "failure" ] || { echo "::error::Run ${{ inputs.run_id }} did not fail; nothing to repair."; exit 1; }
            case "$(echo "$r" | jq -r .displayTitle)" in pipeline-repair*) echo "::error::Run ${{ inputs.run_id }} was itself a repair; not repairing a repair."; exit 1;; esac
            echo "title=Pipeline repair for run ${{ inputs.run_id }} ($(echo "$r" | jq -r .displayTitle))" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          json="$RUNNER_TEMP/issue.json"
          gh issue view "$ISSUE" --repo "$REPO" --json labels,title,state > "$json"
          if jq -e --arg h "$HOLD" '[.labels[].name] | any(. == $h)' "$json" > /dev/null; then
            echo "::error::Issue #$ISSUE carries the hold label again; approval was withdrawn after dispatch. Nothing written."; exit 1; fi
          if [ "$(jq -r .state "$json")" != "OPEN" ]; then echo "::error::Issue #$ISSUE is not open."; exit 1; fi
          echo "title=$(jq -r .title "$json")" >> "$GITHUB_OUTPUT"
          # The dispatcher's note on the issue gets this run's link, so the ticket always points at the live log.
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cid=$(gh api "repos/$REPO/issues/$ISSUE/comments" --paginate --jq '[.[] | select(.user.type == "Bot" and (.body | contains("dispatched on branch")) and (.body | contains(env.BRANCH)))] | last | .id // empty')
          if [ -n "$cid" ] && [ -n "$(gh api "repos/$REPO/issues/comments/$cid" --jq .body 2>/dev/null)" ]; then
            body=$(gh api "repos/$REPO/issues/comments/$cid" --jq .body)
            printf '%s\nRun: %s' "$body" "$run_url" | gh api -X PATCH "repos/$REPO/issues/comments/$cid" -F body=@- >/dev/null || true
          else
            gh issue comment "$ISSUE" --repo "$REPO" --body "Build run: $run_url" >/dev/null || true
          fi

      - name: Fresh checkout of the target repository
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ inputs.repo }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/src"; rm -rf "$dir"
          git -c credential.helper= -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')" clone --quiet "https://github.com/$REPO.git" "$dir"
          cd "$dir"
          git config user.name "${{ github.actor }}"; git config user.email "${{ github.actor }}@users.noreply.github.com"
          git config "http.https://github.com/.extraheader" "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          default=$(git symbolic-ref --short refs/remotes/origin/HEAD | sed 's#origin/##')
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then git checkout -B "$BRANCH" "origin/$BRANCH"; else git checkout -B "$BRANCH" "origin/$default"; fi
          echo "default=$default" >> "$GITHUB_ENV"; echo "src=$dir" >> "$GITHUB_ENV"

      - name: Read the specification, or the review feedback in feedback mode
        id: spec
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ inputs.repo }}
          ISSUE: ${{ inputs.issue }}
          BRANCH: ${{ inputs.branch }}
          SENTINEL: ${{ inputs.spec_sentinel }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "pipeline-repair" ]; then
            run_id="${{ inputs.run_id }}"; here="${{ github.repository }}"
            { echo "# Failed build run $run_id in $here"; echo
              gh run view "$run_id" --repo "$here" --json displayTitle,createdAt,url --jq '"Run name: \(.displayTitle)\nStarted: \(.createdAt)\nURL: \(.url)"'; echo
              echo "## Jobs and steps"; gh run view "$run_id" --repo "$here" --json jobs --jq '.jobs[] | "### \(.name): \(.conclusion)", (.steps[] | "- \(.conclusion // .status) \(.name)")'; echo
              echo "## Failed step log (tail)"; gh run view "$run_id" --repo "$here" --log-failed 2>/dev/null | tail -c 30000; echo
            } > "$RUNNER_TEMP/feedback.md"
            TREPO="${{ inputs.target_repo }}"; [ -n "$TREPO" ] || TREPO="$REPO"
            if [ "$ISSUE" != "0" ] && [ -n "$ISSUE" ]; then
              { echo "# Target ticket $TREPO#$ISSUE"; gh issue view "$ISSUE" --repo "$TREPO" --json title,state,labels,body --jq '"\(.title) [\(.state)] labels=\([.labels[].name]|join(","))\n\n\(.body[0:4000])"'; echo; echo "## Last comments"; gh api "repos/$TREPO/issues/$ISSUE/comments" --paginate --jq '.[-6:][] | "- \(.created_at) \(.user.login): \(.body[0:600])"'; } > "$RUNNER_TEMP/issue.md" 2>/dev/null || true
            else echo "(no target ticket parsed from the run name)" > "$RUNNER_TEMP/issue.md"; fi
            : > "$RUNNER_TEMP/spec.md"
            exit 0
          fi
          gh issue view "$ISSUE" --repo "$REPO" --json body --jq .body > "$RUNNER_TEMP/issue.md"
          gh api "repos/$REPO/issues/$ISSUE/comments" --paginate --jq '[.[] | select(.body | contains(env.SENTINEL))] | last | .body // empty' > "$RUNNER_TEMP/spec.md"
          if [ "$MODE" = "repair" ]; then
            pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number')
            [ -n "$pr" ] || { echo "::error::No open PR on $BRANCH to repair."; exit 1; }
            sha=$(gh pr view "$pr" --repo "$REPO" --json headRefOid --jq .headRefOid)
            { echo "# Failing checks on pull request #$pr (head $sha)"; echo
              gh api "repos/$REPO/commits/$sha/check-runs?per_page=100" --jq '.check_runs[] | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral") | "## \(.name): \(.conclusion)\nrun: \(.html_url)\n"'
              for rid in $(gh api "repos/$REPO/actions/runs?head_sha=$sha&status=failure&per_page=10" --jq '.workflow_runs[].id'); do
                echo "### Failed log excerpt, run $rid"; echo '```'; gh run view "$rid" --repo "$REPO" --log-failed 2>/dev/null | grep -v -E '^\s*$' | tail -n 200 | cut -c1-400; echo '```'; done
            } > "$RUNNER_TEMP/feedback.md"
            echo "pr=$pr" >> "$GITHUB_OUTPUT"
          elif [ "$MODE" = "feedback" ]; then
            pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number')
            [ -n "$pr" ] || { echo "::error::No open PR on $BRANCH to take feedback for."; exit 1; }
            { echo "# Review feedback on pull request #$pr"; echo
              gh api "repos/$REPO/pulls/$pr/reviews" --paginate --jq '.[] | select(.body != "" and .body != null) | "## Review by \(.user.login) (\(.state))\n\(.body)\n"'
              gh api "repos/$REPO/pulls/$pr/comments" --paginate --jq '.[] | "## Comment by \(.user.login) on \(.path) line \(.line // .original_line)\n\(.body)\n"'
              gh api "repos/$REPO/issues/$pr/comments" --paginate --jq '.[] | select(.user.type != "Bot") | "## Conversation comment by \(.user.login)\n\(.body)\n"'
            } > "$RUNNER_TEMP/feedback.md"
            [ "$(wc -c < "$RUNNER_TEMP/feedback.md")" -gt 60 ] || { echo "::error::No review feedback found on PR #$pr."; exit 1; }
            echo "pr=$pr" >> "$GITHUB_OUTPUT"
          else
            # A ticket written to the standard carries its scenarios in the body (the spec label tells triage to
            # skip it); the body is then the specification. A ticket with neither has not been triaged.
            if [ ! -s "$RUNNER_TEMP/spec.md" ] && grep -qiE '^[[:space:]]*(Scenario|Given)\b' "$RUNNER_TEMP/issue.md"; then
              cp "$RUNNER_TEMP/issue.md" "$RUNNER_TEMP/spec.md"; echo "Specification: the ticket body (scenarios present, no spec comment)."
            fi
            [ -s "$RUNNER_TEMP/spec.md" ] || { echo "::error::No specification comment and no scenarios in the body of #$ISSUE; the triage step has not run."; exit 1; }
          fi

      - name: Build the ticket with the coding agent
        id: agent
        working-directory: ${{ env.src }}
        env:
          MAX_TURNS: ${{ inputs.max_turns }}
          REPO: ${{ inputs.repo }}
          ISSUE: ${{ inputs.issue }}
          AGENT: ${{ inputs.agent }}
          MODE: ${{ inputs.mode }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -uo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          cat > "$RUNNER_TEMP/prompt.md" <<'PROMPT'
          You are building a GitHub issue in a fresh checkout on the branch this ticket builds on. Work here and nowhere else.

          The issue body is in the file named by ISSUE_FILE and the approved specification comment is in the file named by SPEC_FILE (both paths are given below). Follow the specification; where it is silent, make the smallest change that satisfies the ticket.

          Write the failing test first, run it, then make it pass. Run the repository's own lint, typecheck, test and build commands if they exist and leave them green. Commit on the current branch with a message that says what changed and why. Do not push and do not open a pull request; the workflow does that after you stop.
          PROMPT
          if [ "$MODE" = "repair" ]; then
            cat > "$RUNNER_TEMP/prompt.md" <<'PROMPT'
          You are repairing a failing check on an open pull request, in a fresh checkout of that PR's branch.

          The original issue is in the file named by ISSUE_FILE, the approved specification in SPEC_FILE, and the failing checks with their log excerpts in FEEDBACK_FILE. Find the cause of the failure and decide where the fix belongs:

          - If the fix belongs in this repository: make it here, run the repository's own lint, typecheck, test and build commands, leave them green, and commit on the current branch with a message that names the failing check and what you changed. Do not push.
          - If the fix requires a change in a different repository (a reusable workflow, a shared package, a template this repository consumes): change nothing on this branch. Instead open one issue in that repository with `gh issue create`, quoting the failing check, the run link and the reason, and print its URL as the last line of your output. Do not commit anything here.
          PROMPT
            printf '\nFEEDBACK_FILE=%s' "$RUNNER_TEMP/feedback.md" >> "$RUNNER_TEMP/prompt.md"
          elif [ "$MODE" = "pipeline-repair" ]; then
            cat > "$RUNNER_TEMP/prompt.md" <<'PROMPT'
          You are the pipeline's repair agent. A run of this repository's build workflow failed; you are in a fresh checkout of this repository (the pipeline's own configuration and workflows) on a repair branch. FEEDBACK_FILE holds the failed run's name, jobs, steps and failing log; ISSUE_FILE holds the ticket that run was building, if any; TARGET_REPO/ISSUE name that ticket (TARGET_REPO is not this repository); RUN_ID is the failed run.

          Diagnose the cause from the log, then decide where the fix belongs, and write your decision to OUTCOME_FILE as JSON: {"outcome": "...", "summary": "...", "title": "...", "body": "..."}.
          - First run `gh pr list --repo REPO_HERE --state open --label REPAIR_LABEL` and read any open repair PR; if one already fixes this cause, outcome "already-fixed" with its URL in summary, change nothing.
          - "fix-here": the cause is in this repository (the build workflow, automation/pipeline.json, scripts). Make the smallest correct fix, run `actionlint` on any workflow you touched and `python3 -m json.tool` on any JSON, commit on the current branch with a message that names the failed run and the cause. Create a Bug ticket in this repository first with `gh issue create --label bug --label bdd` in the shape: what is wrong (one sentence), a Given/When/Then scenario with "But instead", evidence (the run URL and the log line), done when. Put its URL in "ticket" and write "title" (one line) and "body" (Why paragraph with the run link and the ticket link, What changed, How to verify, Risk and rollback) for the pull request; the workflow opens and merges it. Do not push and do not open the PR yourself.
          - "ticket": the cause is the target ticket or its repository (no specification, a hold re-applied, a branch that cannot be built, a repository the runner cannot build). Post one comment on that ticket with `gh issue comment` naming the cause and the exact change it needs, add the label `needs:triage` with `gh issue edit --add-label`, change nothing here.
          - "operator": the cause is in the n8n workflows or something outside this repository. Create a Bug ticket in OPERATOR_REPO with `gh issue create --label bug --label bdd` holding the diagnosis, the run link and the exact node or setting to change; change nothing here.
          Be precise and short in every comment and ticket. Never touch secrets, tokens or credentials. Never edit files outside this checkout.
          PROMPT
            sed -i '' "s#REPO_HERE#${{ github.repository }}#; s#REPAIR_LABEL#${{ inputs.repair_label }}#; s#OPERATOR_REPO#${{ inputs.operator_repo }}#" "$RUNNER_TEMP/prompt.md" 2>/dev/null || sed -i "s#REPO_HERE#${{ github.repository }}#; s#REPAIR_LABEL#${{ inputs.repair_label }}#; s#OPERATOR_REPO#${{ inputs.operator_repo }}#" "$RUNNER_TEMP/prompt.md"
            printf '\nFEEDBACK_FILE=%s\nOUTCOME_FILE=%s\nRUN_ID=%s\nTARGET_REPO=%s' "$RUNNER_TEMP/feedback.md" "$RUNNER_TEMP/outcome.json" "${{ inputs.run_id }}" "${{ inputs.target_repo }}" >> "$RUNNER_TEMP/prompt.md"
          elif [ "$MODE" = "feedback" ]; then
            cat > "$RUNNER_TEMP/prompt.md" <<'PROMPT'
          You are addressing review feedback on an open pull request, in a fresh checkout of that PR's branch. Work here and nowhere else.

          The original issue is in the file named by ISSUE_FILE, the approved specification in SPEC_FILE, and every review comment in FEEDBACK_FILE. Address each piece of feedback: change what the reviewer asked for, keep the tests green, add or adjust tests where the feedback implies behaviour. Commit on the current branch with a message that says which feedback each change answers. Do not push and do not open anything; the workflow pushes after you stop.
          PROMPT
            printf '\nFEEDBACK_FILE=%s' "$RUNNER_TEMP/feedback.md" >> "$RUNNER_TEMP/prompt.md"
          fi
          printf '\nISSUE_FILE=%s\nSPEC_FILE=%s\nREPO=%s\nISSUE=%s\n' "$RUNNER_TEMP/issue.md" "$RUNNER_TEMP/spec.md" "$REPO" "$ISSUE" >> "$RUNNER_TEMP/prompt.md"
          # Progress streams into this log as it happens; the full event stream is kept for the run.
          # The step never fails the job by itself: the push step decides what to do with whatever the
          # agent committed, and reports the agent's exit separately.
          "$AGENT" -p "$(cat "$RUNNER_TEMP/prompt.md")" --permission-mode acceptEdits --max-turns "$MAX_TURNS" \
            --output-format stream-json --verbose \
            --add-dir "$RUNNER_TEMP" \
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(npm ci:*),Bash(npm install:*),Bash(npm run:*),Bash(npm test:*),Bash(npx:*),Bash(node:*),Bash(git add:*),Bash(git commit:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(ls:*),Bash(cat:*)$([ "$MODE" = "repair" ] && printf ',Bash(gh issue create:*),Bash(gh issue view:*),Bash(gh api:*)')$([ "$MODE" = "pipeline-repair" ] && printf ',Bash(gh run view:*),Bash(gh run list:*),Bash(gh api:*),Bash(gh issue create:*),Bash(gh issue comment:*),Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(actionlint:*),Bash(python3:*),Bash(jq:*)')" \
            2> "$RUNNER_TEMP/agent.stderr" | tee "$RUNNER_TEMP/agent.jsonl" | node -e '
              const rl = require("readline").createInterface({ input: process.stdin });
              const short = v => { const t = typeof v === "string" ? v : JSON.stringify(v); return t.length > 160 ? t.slice(0, 160) + "…" : t; };
              rl.on("line", line => { let e; try { e = JSON.parse(line); } catch { return; }
                if (e.type === "assistant" && e.message && Array.isArray(e.message.content)) for (const b of e.message.content) {
                  if (b.type === "text" && b.text.trim()) console.log(b.text.trim());
                  if (b.type === "tool_use") console.log("▶ " + b.name + " " + short(b.input && (b.input.command || b.input.file_path || b.input.pattern || b.input.description || b.input)));
                }
                if (e.type === "result") console.log("■ " + e.subtype + " turns=" + e.num_turns + " " + Math.round((e.duration_ms || 0) / 1000) + "s" + (e.is_error ? " (error)" : ""));
              });'
          rc=${PIPESTATUS[0]}
          [ -s "$RUNNER_TEMP/agent.stderr" ] && { echo "--- agent stderr (tail)"; tail -c 4000 "$RUNNER_TEMP/agent.stderr"; }
          reason=$(node -e 'const fs=require("fs"); const l=fs.readFileSync(process.argv[1],"utf8").trim().split("\n").reverse().find(x=>x.includes("\"type\":\"result\"")); if(l){const r=JSON.parse(l); console.log(r.subtype + " after " + r.num_turns + " turns")} else console.log("no result event (exit " + process.argv[2] + ")")' "$RUNNER_TEMP/agent.jsonl" "$rc" 2>/dev/null || echo "exit $rc")
          echo "exit=$rc" >> "$GITHUB_OUTPUT"; echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "agent finished: $reason (exit $rc)"

      - name: Push the branch and open the pull request
        working-directory: ${{ env.src }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ inputs.repo }}
          ISSUE: ${{ inputs.issue }}
          BRANCH: ${{ inputs.branch }}
          TITLE: ${{ steps.gate.outputs.title }}
          REVIEWERS: ${{ inputs.reviewers }}
          PR_OPEN: ${{ inputs.pr_open_label }}
          AGENT_EXIT: ${{ steps.agent.outputs.exit }}
          AGENT_REASON: ${{ steps.agent.outputs.reason }}
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ inputs.mode }}" = "pipeline-repair" ]; then
            outcome=$(jq -r '.outcome // "none"' "$RUNNER_TEMP/outcome.json" 2>/dev/null || echo none)
            summary=$(jq -r '.summary // ""' "$RUNNER_TEMP/outcome.json" 2>/dev/null || true)
            echo "outcome: $outcome — $summary"
            if [ "$outcome" = "fix-here" ] && [ -n "$(git log "origin/$default..HEAD" --oneline)" ]; then
              git push -u origin "$BRANCH"
              title=$(jq -r '.title // "pipeline repair"' "$RUNNER_TEMP/outcome.json"); pbody=$(jq -r '.body // ""' "$RUNNER_TEMP/outcome.json")
              gh label create "${{ inputs.repair_label }}" --repo "${{ github.repository }}" --color D93F0B --description "Opened by the pipeline's repair agent" 2>/dev/null || true
              pr=$(gh pr create --repo "${{ github.repository }}" --head "$BRANCH" --base "$default" --title "$title" --body "$(printf '%s\n\nRepairs failed run: %s\nRepair run: %s' "$pbody" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.run_id }}" "$run_url")" --label "${{ inputs.repair_label }}" --reviewer "$REVIEWERS" --assignee "$REVIEWERS")
              if [ "${{ inputs.auto_merge }}" = "true" ]; then gh pr merge "$pr" --repo "${{ github.repository }}" --squash --delete-branch || gh pr merge "$pr" --repo "${{ github.repository }}" --squash --delete-branch --auto || true; fi
              TREPO="${{ inputs.target_repo }}"; [ -n "$TREPO" ] || TREPO="$REPO"
              if [ -n "$ISSUE" ] && [ "$ISSUE" != "0" ]; then gh issue comment "$ISSUE" --repo "$TREPO" --body "Pipeline repaired: $pr ($summary). The failed build is released again after the claim window." || true; fi
            elif [ "$outcome" = "fix-here" ]; then
              echo "::error::Outcome fix-here but nothing was committed."; exit 1
            elif [ "$outcome" = "none" ] && [ "$AGENT_EXIT" != "0" ]; then
              echo "::error::The repair agent stopped without a decision: $AGENT_REASON"; exit 1
            fi
            exit 0
          fi
          if [ -z "$(git log "origin/$default..HEAD" --oneline)" ] || { { [ "${{ inputs.mode }}" = "feedback" ] || [ "${{ inputs.mode }}" = "repair" ]; } && [ -z "$(git log "origin/$BRANCH..HEAD" --oneline 2>/dev/null)" ]; }; then
            if [ "$AGENT_EXIT" != "0" ]; then
              echo "::error::The coding agent stopped without committing anything: $AGENT_REASON. Nothing to push."; exit 1
            elif [ "${{ inputs.mode }}" = "repair" ]; then
              gh pr comment "$BRANCH" --repo "$REPO" --body "Repair run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} changed nothing on this branch: the cause was judged to live outside this repository (an issue was opened there if the agent found one; see the run log) or could not be fixed automatically. A person decides next."
            else
              gh issue comment "$ISSUE" --repo "$REPO" --body "Build run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} committed nothing; the ticket needs a person. Its approval stands."
            fi
            exit 0; fi
          git push -u origin "$BRANCH"
          partial=""; [ "$AGENT_EXIT" != "0" ] && partial=" The agent stopped before it finished ($AGENT_REASON), so this is partial: read what landed against the specification, then comment on the pull request with what remains and the feedback run continues from here."
          if [ "${{ inputs.mode }}" = "feedback" ] || [ "${{ inputs.mode }}" = "repair" ]; then
            what="Addressed the review feedback"; [ "${{ inputs.mode }}" = "repair" ] && what="Repaired the failing check"
            gh pr comment "$BRANCH" --repo "$REPO" --body "$what in a new commit on this branch. Run: $run_url.$partial Branch protection dismisses an earlier approval when a commit lands, so review has been requested again."
            gh pr edit "$BRANCH" --repo "$REPO" --add-reviewer "$REVIEWERS" >/dev/null || true
            exit 0
          fi
          if ! gh pr view "$BRANCH" --repo "$REPO" >/dev/null 2>&1; then
            run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            issue_url="https://github.com/$REPO/issues/$ISSUE"
            # Why: the specification's Problem paragraph, which states the ticket's purpose in prose; the issue's
            # first paragraph when the spec has none. Local absolute paths never reach a pull request body.
            why=$(awk 'BEGIN{p=0} /^\*\*Problem\*\*/{p=1; next} p==1 && NF{print; exit}' "$RUNNER_TEMP/spec.md" | sed -E 's#/Users/[^ )`]*#(local path)#g')
            [ -n "$why" ] || why=$(awk 'NF && !/^#/{print; exit}' "$RUNNER_TEMP/issue.md" | sed -E 's#/Users/[^ )`]*#(local path)#g')
            commits=$(git log "origin/$default..HEAD" --format='- %s')
            stat=$(git diff --stat "origin/$default..HEAD" | sed 's/^/    /')
            tests=$(node -e 'const p=require("./package.json").scripts||{}; console.log(["lint","typecheck","test","build"].filter(k=>p[k]).map(k=>"npm run "+k).join(", "))' 2>/dev/null || true)
            body=$(printf '## Why\n\n%s\n\n**Ticket:** %s (#%s)\n\n## What changed\n\n%s\n\nFiles:\n\n%s\n\n## How to verify\n\nThe build ran the repository'"'"'s own checks before committing%s. Required status checks run on this PR. Build run: %s\n\n## Risk and rollback\n\nScoped to the files above; nothing outside the ticket was touched. Revert this squash commit to roll back.\n\nCloses #%s' "$why" "$issue_url" "$ISSUE" "$commits" "$stat" "${tests:+ ($tests)}" "$run_url" "$ISSUE")
            draft=""; [ "$AGENT_EXIT" != "0" ] && draft="--draft"
            gh pr create --repo "$REPO" --head "$BRANCH" --base "$default" --title "$TITLE (#$ISSUE)" --body "$body" --reviewer "$REVIEWERS" --assignee "$REVIEWERS" $draft
            [ -n "$partial" ] && gh pr comment "$BRANCH" --repo "$REPO" --body "Opened as a draft.$partial Mark it ready for review when it is complete; drafts are never merged."
          fi
          gh api -X POST "repos/$REPO/issues/$ISSUE/labels" -f "labels[]=$PR_OPEN" >/dev/null   # creates the label if the repo lacks it
          gh issue comment "$ISSUE" --repo "$REPO" --body "Pull request opened: $(gh pr view "$BRANCH" --repo "$REPO" --json url --jq .url)"

      - name: Report a failed build on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ inputs.repo }}
          ISSUE: ${{ inputs.issue }}
        run: |
          [ "${{ inputs.mode }}" != "pipeline-repair" ] || exit 0
          [ "$ISSUE" != "0" ] && [ -n "$ISSUE" ] || exit 0
          gh issue comment "$ISSUE" --repo "$REPO" --body "Build failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (${{ steps.agent.outputs.reason || 'before the agent ran' }}). The issue stays approved and is released to build again ${{ inputs.claim_minutes }} minutes after this one started, up to ${{ inputs.max_attempts }} attempts in total; after that the hold label comes back and a person decides." || true
