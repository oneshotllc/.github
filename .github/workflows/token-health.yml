name: Token health

# Ask whether the credentials this repository runs on are still what they
# claim to be, and report as a commit status on the tip of the current SHA —
# no model call, only a fact check.

on:
  workflow_call:
    inputs:
      runs-on-label:
        required: false
        type: string
        default: '"ubuntu-latest"'
      expected-author:
        description: The app login automerge.yml arms for, to verify the app token identity against.
        required: false
        type: string
        default: ""
      required-secret-names:
        description: Comma-separated list of secret names that must be non-empty for CI to work.
        required: false
        type: string
        default: ""
    secrets:
      app-id:
        required: false
      app-private-key:
        required: false
      required-secrets-json:
        description: JSON object mapping each name in required-secret-names to its value.
        required: false

permissions:
  contents: read
  statuses: write

concurrency:
  group: token-health-${{ github.workflow_ref }}
  cancel-in-progress: true

jobs:
  identity:
    if: inputs.expected-author != ''
    runs-on: ${{ fromJSON(inputs.runs-on-label) }}
    steps:
      - name: Ask the credentials which app they are
        id: identity
        env:
          APP_ID: ${{ secrets.app-id }}
          PRIVATE_KEY: ${{ secrets.app-private-key }}
          EXPECTED: ${{ inputs.expected-author }}
        run: |
          set -uo pipefail
          if [ -z "${APP_ID:-}" ] || [ -z "${PRIVATE_KEY:-}" ]; then
            echo "verdict=2" >> "$GITHUB_OUTPUT"
            echo "::warning::No app-id/app-private-key input — cannot verify identity."
            exit 0
          fi
          now=$(date +%s)
          iat=$((now - 60))
          exp=$((now + 300))
          header='{"alg":"RS256","typ":"JWT"}'
          payload=$(printf '{"iat":%s,"exp":%s,"iss":"%s"}' "$iat" "$exp" "$APP_ID")
          b64() { openssl base64 -e -A | tr '+/' '-_' | tr -d '='; }
          h=$(printf '%s' "$header" | b64)
          p=$(printf '%s' "$payload" | b64)
          sig=$(printf '%s.%s' "$h" "$p" | openssl dgst -sha256 -sign <(printf '%s' "$PRIVATE_KEY") | b64)
          jwt="$h.$p.$sig"
          resp=$(curl -sf -H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json" https://api.github.com/app || echo "")
          slug=$(printf '%s' "$resp" | jq -r '.slug // empty' 2>/dev/null || echo "")
          login="${slug:+${slug}[bot]}"
          if [ -n "$login" ] && [ "$login" = "$EXPECTED" ]; then
            echo "verdict=0" >> "$GITHUB_OUTPUT"
          elif [ -n "$login" ]; then
            echo "verdict=1" >> "$GITHUB_OUTPUT"
            echo "::warning::App identity is '$login', expected '$EXPECTED'."
          else
            echo "verdict=1" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not resolve app identity from GET /app."
          fi

      - name: Report the verdict
        if: always() && steps.identity.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ steps.identity.outputs.verdict }}
        run: |
          set -uo pipefail
          case "$VERDICT" in
            0) state=success; desc="Identity verified" ;;
            1) state=failure; desc="Identity mismatch or unresolved" ;;
            *) state=pending; desc="Could not verify identity" ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="token-health" -f description="$desc" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "## Token health: identity"
            echo
            echo "$desc"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$VERDICT" = "1" ] && exit 1 || exit 0

  credentials:
    if: inputs.required-secret-names != ''
    runs-on: ${{ fromJSON(inputs.runs-on-label) }}
    steps:
      - name: Check required secrets are present
        id: probe
        env:
          NAMES: ${{ inputs.required-secret-names }}
          SECRETS_JSON: ${{ secrets.required-secrets-json }}
        run: |
          set -uo pipefail
          status=0
          failed=""
          IFS=',' read -ra arr <<< "$NAMES"
          for name in "${arr[@]}"; do
            name=$(echo "$name" | xargs)
            val=$(printf '%s' "$SECRETS_JSON" | jq -r --arg n "$name" '.[$n] // empty' 2>/dev/null || echo "")
            if [ -z "$val" ]; then
              failed="$failed $name"
              status=1
            fi
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "failed=$(echo "$failed" | xargs)" >> "$GITHUB_OUTPUT"

      - name: Report the verdict
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.probe.outputs.status }}
          FAILED: ${{ steps.probe.outputs.failed }}
        run: |
          set -uo pipefail
          if [ "$STATUS" -eq 0 ]; then
            state=success; desc="Every required credential is present"
          else
            state=failure; desc="Missing: ${FAILED:-unknown}"
          fi
          description=$(printf '%.139s' "$desc")
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="token-health / credentials" -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "## Token health: credentials"
            echo
            echo "$desc"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$STATUS" -eq 1 ] && exit 1 || exit 0
