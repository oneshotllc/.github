name: Actions budget

# Ask GitHub's billing usage endpoint whether the organization's Actions
# minutes (or any paid product) have crossed the plan's included allowance
# this month, and report as a commit status. No model call — a fact.

on:
  workflow_call:
    inputs:
      runs-on-label:
        required: false
        type: string
        default: '"ubuntu-latest"'
      org:
        description: The GitHub organization to check billing usage for.
        required: true
        type: string
    secrets:
      budget-token:
        description: An admin:org-scoped token able to read the billing usage endpoint.
        required: false

permissions:
  contents: read
  statuses: write

concurrency:
  group: actions-budget-${{ github.workflow_ref }}
  cancel-in-progress: true

jobs:
  budget:
    runs-on: ${{ fromJSON(inputs.runs-on-label) }}
    steps:
      - name: Ask GitHub whether this month's usage is fully discounted
        id: probe
        env:
          BUDGET_TOKEN: ${{ secrets.budget-token }}
          ORG: ${{ inputs.org }}
        run: |
          set -uo pipefail
          if [ -z "${BUDGET_TOKEN:-}" ]; then
            echo "status=2" >> "$GITHUB_OUTPUT"
            echo "::warning::No budget-token secret set — cannot read billing usage."
            exit 0
          fi
          year=$(date -u +%Y)
          month=$(date -u +%-m)
          resp=$(curl -sf -H "Authorization: Bearer $BUDGET_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/organizations/$ORG/settings/billing/usage?year=$year&month=$month" 2>/dev/null || echo "")
          if [ -z "$resp" ]; then
            echo "status=2" >> "$GITHUB_OUTPUT"
            echo "::warning::Billing usage endpoint did not respond."
            exit 0
          fi
          overage=$(printf '%s' "$resp" | jq '[.usageItems[]? | select(.netAmount > 0)] | length' 2>/dev/null || echo "0")
          if [ "${overage:-0}" -gt 0 ]; then
            echo "status=1" >> "$GITHUB_OUTPUT"
          else
            echo "status=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Report the verdict
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.probe.outputs.status }}
          ORG: ${{ inputs.org }}
        run: |
          set -uo pipefail
          case "$STATUS" in
            0) state=success; desc="This month's usage is fully within the included allowance" ;;
            1) state=failure; desc="A paid product has crossed its included allowance" ;;
            *) state=pending; desc="Could not read this month's billing usage" ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="actions-budget" -f description="$desc" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "## This month's billing usage ($ORG)"
            echo
            echo "$desc"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$STATUS" = "1" ] && exit 1 || exit 0
