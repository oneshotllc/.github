name: Production deploy

# Promote a previously-built version/artifact to production traffic. Only
# ever triggered from a caller's workflow_dispatch stub — never on merge — so
# production moves only when a person fires it. The caller supplies the exact
# promote command for its stack.

on:
  workflow_call:
    inputs:
      runs-on-label:
        required: false
        type: string
        default: '"ubuntu-latest"'
      node-version:
        required: false
        type: string
        default: "24"
      alias:
        description: The build/version identifier to promote.
        required: false
        type: string
        default: "main"
      promote-command:
        description: Promotes $PROMOTE_ALIAS to production. Required.
        required: true
        type: string
    secrets:
      deploy-token:
        required: false

concurrency:
  group: production-deploy-${{ github.workflow_ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ${{ fromJSON(inputs.runs-on-label) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: inputs.node-version != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Promote to production
        env:
          PROMOTE_ALIAS: ${{ inputs.alias }}
          DEPLOY_TOKEN: ${{ secrets.deploy-token }}
        run: ${{ inputs.promote-command }}

      - name: Say what moved
        env:
          ALIAS: ${{ inputs.alias }}
        run: |
          {
            echo "## Promoted to production"
            echo
            echo "Alias \`$ALIAS\` promoted by \`$GITHUB_ACTOR\` via workflow_dispatch."
          } >> "$GITHUB_STEP_SUMMARY"
