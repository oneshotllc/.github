name: Provision site

# The site provisioner: turns one organization name into a complete,
# working site system — a repo cloned from oneshotmn/site-template, its
# __TOKEN__ placeholders substituted, a Fly app + volume, an admin
# passphrase, the repo secrets the caller-stub workflows need, an entry in
# oneshot-pipeline's organizations.yaml, and a first preview build.
#
# Every step converges (idempotent — safe to run twice for the same org).
# Anything requiring a credential this runner doesn't have files a
# provisioning ticket in oneshotmn/.github and provisioning continues past
# it (see scripts/provisioner/provision.py's ticket contract).
#
# Runs on ubuntu-latest deliberately: the org's only self-hosted runner is
# scoped to oneshotmn/oneshotmn (legacy, out of scope — never touched by
# this workflow) and is not available to other repos.
#
# "Is it deployed?" has exactly one accepted answer: the render proof step
# below (scripts/provisioner/render_proof.py). Headless Chromium on this
# GitHub-hosted runner - clean network, outside our infrastructure, no
# resolver overrides - loads the live URL as an anonymous phone and desktop
# visitor; screenshots + report.json are uploaded as the run's
# render-proof-<fly_app> artifact, and a FAIL fails the job. A 200 from curl
# is not evidence (a site once answered 200 while its CSS/JS pointed at a
# domain with no DNS), and neither is anything checked from the local Mac:
# its resolver returns only AAAA for *.fly.dev with no IPv6 route, so it
# fails live sites, and resolver hacks there prove nothing about real
# visitors. render_verdict=PASS means the page rendered on the runner;
# SKIPPED (no live_url: dry run, no image, never reached 200) proves nothing.

on:
  workflow_call:
    inputs:
      org_name:
        description: The organization/site name to provision, e.g. "Voices of Power".
        required: true
        type: string
      promote:
        description: Point the real domain at the site (DNS + cert). Provisioning leaves production alone unless this is true - promote is a deliberate act, not a side effect.
        required: false
        type: boolean
        default: false
      image_ref:
        description: Prebuilt image the deploy step ships, e.g. registry.fly.io/oneshot-site-images:latest.
        required: false
        type: string
        default: registry.fly.io/oneshot-site-images:latest
      domain:
        description: Optional custom domain. Defaults to <slug>.oneshot.help.
        required: false
        type: string
        default: ""
      region:
        description: Fly.io region for the app + volume.
        required: false
        type: string
        default: "ord"
      dry_run:
        description: Compute the plan (slug, repo, fly app, domain) without creating anything.
        required: false
        type: boolean
        default: false
    secrets:
      pr-app-id:
        description: The oneshot-pr GitHub App's ID, for identity on repo/git operations.
        required: true
      pr-app-private-key:
        description: The oneshot-pr GitHub App's private key.
        required: true
      fly-api-token:
        description: A Fly.io API token able to create apps/volumes in the oneshot-llc org.
        required: true
      cloudflare-api-token:
        description: Zone-scoped Cloudflare token (dns_records edit) for the site's DNS record.
        required: false
      cloudflare-zone-id:
        description: Cloudflare zone id for the parent domain.
        required: false
    outputs:
      repo:
        description: The full "owner/name" of the provisioned repository.
        value: ${{ jobs.provision.outputs.repo }}
      slug:
        description: The derived org slug.
        value: ${{ jobs.provision.outputs.slug }}
      fly_app:
        description: The Fly app name.
        value: ${{ jobs.provision.outputs.fly_app }}
      tickets_filed:
        description: Count of provisioning tickets filed for follow-up.
        value: ${{ jobs.provision.outputs.tickets_filed }}
      live_url:
        description: The .fly.dev URL that answered 200; empty on dry run, no image_ref, or never reached.
        value: ${{ jobs.provision.outputs.live_url }}
      render_verdict:
        description: PASS/FAIL from the runner's render proof of live_url; SKIPPED when live_url is empty (SKIPPED is not evidence of a deployed site).
        value: ${{ jobs.provision.outputs.render_verdict }}

permissions:
  contents: read

concurrency:
  group: provision-site-${{ inputs.org_name }}
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    # 20, not 15: the render proof adds a Chromium install (~1-2 min) and
    # two renders after the up-to-300s liveness poll.
    timeout-minutes: 20
    outputs:
      repo: ${{ steps.run.outputs.repo }}
      slug: ${{ steps.run.outputs.slug }}
      fly_app: ${{ steps.run.outputs.fly_app }}
      tickets_filed: ${{ steps.run.outputs.tickets_filed }}
      live_url: ${{ steps.run.outputs.live_url }}
      render_verdict: ${{ steps.run.outputs.live_url == '' && 'SKIPPED' || steps.render.outputs.verdict }}
    steps:
      - name: Check out this repo's provisioner scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/provisioner

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install provisioner dependencies
        run: pip install --quiet pyyaml

      - name: Mint the oneshot-pr app token (used for every gh/git call)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.pr-app-id }}
          private-key: ${{ secrets.pr-app-private-key }}
          # Without `owner`, the minted token is scoped to THIS repository
          # only, so pushing to a repo the provisioner just created fails
          # with "Repository not found" (live run 34793604383). Org scope
          # covers every repo the app is installed on, including new ones.
          owner: ${{ github.repository_owner }}

      - name: Install flyctl
        run: curl -L https://fly.io/install.sh | sh

      - name: Run the provisioner
        id: run
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          FLY_API_TOKEN: ${{ secrets.fly-api-token }}
          PR_APP_ID_VALUE: ${{ secrets.pr-app-id }}
          PR_APP_PRIVATE_KEY_VALUE: ${{ secrets.pr-app-private-key }}
          ORG_NAME: ${{ inputs.org_name }}
          DOMAIN: ${{ inputs.domain }}
          REGION: ${{ inputs.region }}
          DRY_RUN: ${{ inputs.dry_run }}
          PROMOTE: ${{ inputs.promote }}
          # Deploy a PREBUILT image: image build time must never sit in the
          # provisioning path (publish-image.yml builds it once).
          IMAGE_REF: ${{ inputs.image_ref }}
          # Zone-scoped token: enough for the DNS record + cert, nothing more.
          CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare-api-token }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.cloudflare-zone-id }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.fly/bin:$PATH"
          python scripts/provisioner/ci_entrypoint.py

      - name: Report the plan
        env:
          REPO: ${{ steps.run.outputs.repo }}
          TICKETS: ${{ steps.run.outputs.tickets_filed }}
        run: |
          {
            echo "## Provisioned $REPO"
            echo
            echo "Tickets filed for follow-up: ${TICKETS:-0}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Render proof: the only accepted evidence the site is deployed (see
      # the header). Runs only when the provisioner reached a live URL.
      - name: Install Playwright + Chromium for the render proof
        if: steps.run.outputs.live_url != ''
        run: |
          set -euo pipefail
          pip install --quiet playwright==1.62.0
          python -m playwright install --with-deps chromium

      - name: Render proof of the live URL (FAIL fails the job)
        id: render
        if: steps.run.outputs.live_url != ''
        env:
          LIVE_URL: ${{ steps.run.outputs.live_url }}
        run: python scripts/provisioner/render_proof.py "$LIVE_URL" "$RUNNER_TEMP/render-proof"

      - name: Upload render proof (screenshots + report.json)
        if: always() && steps.run.outputs.live_url != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: render-proof-${{ steps.run.outputs.fly_app }}
          path: ${{ runner.temp }}/render-proof
          retention-days: 30
          if-no-files-found: error
