name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # `check` is the one context the pipeline counts; a repair PR merges only when it is green.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Workflows parse and lint
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/rhysd/actionlint/releases/latest/download/actionlint_$(curl -sSL https://api.github.com/repos/rhysd/actionlint/releases/latest | python3 -c 'import json,sys;print(json.load(sys.stdin)["tag_name"].lstrip("v"))')_linux_amd64.tar.gz" | tar xz actionlint
          ./actionlint -color
      - name: Configuration is valid JSON with the required keys
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open("automation/pipeline.json"))
          for k in ("org", "streams", "queues", "keys", "labels", "approvers", "ingress", "merge", "dependabot", "ci", "build", "feedback", "repair", "pipeline_repair", "branch_protection"):
              assert k in d, f"missing top-level key: {k}"
          print("ok")
          EOF
