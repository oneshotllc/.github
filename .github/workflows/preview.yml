name: Preview

# Build and deploy a preview for a pull request or a push to the default
# branch. The caller supplies the build command and the deploy command; this
# workflow's job is sequencing (build, then deploy, then post the URL where a
# reviewer looks) and the concurrency/close bookkeeping. `deploy-command` MUST
# write the resulting preview URL to the file named by `$PREVIEW_URL_FILE`
# (path passed to it as an env var) — that is the one contract between this
# workflow and whatever the caller's stack actually does to produce a preview.

on:
  workflow_call:
    inputs:
      runs-on-label:
        required: false
        type: string
        default: '"ubuntu-latest"'
      node-version:
        required: false
        type: string
        default: "24"
      install-command:
        required: false
        type: string
        default: "npm ci"
      build-command:
        description: Builds the branch for preview deployment.
        required: false
        type: string
        default: "npm run build"
      deploy-command:
        description: >-
          Deploys the build and writes the preview URL to the file at
          $PREVIEW_URL_FILE. Receives $PREVIEW_REF (pr-<n> or the branch name).
        required: true
        type: string
      teardown-command:
        description: Optional command run when a pull request closes. No default action if empty.
        required: false
        type: string
        default: ""
    secrets:
      deploy-token:
        description: Credential the deploy command needs (e.g. a Cloudflare or Fly API token).
        required: false
    outputs:
      preview-url:
        description: The URL of the deployed preview.
        value: ${{ jobs.preview.outputs.preview-url }}

concurrency:
  group: preview-${{ github.workflow_ref }}-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: ${{ fromJSON(inputs.runs-on-label) }}
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    outputs:
      preview-url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: inputs.node-version != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - if: inputs.install-command != ''
        run: ${{ inputs.install-command }}

      - name: Build for preview
        run: ${{ inputs.build-command }}

      - name: Deploy and capture the URL
        id: deploy
        env:
          PREVIEW_REF: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
          PREVIEW_URL_FILE: ${{ runner.temp }}/preview-url.txt
          DEPLOY_TOKEN: ${{ secrets.deploy-token }}
        run: |
          set -euo pipefail
          : > "$PREVIEW_URL_FILE"
          ${{ inputs.deploy-command }}
          url=$(cat "$PREVIEW_URL_FILE")
          if [ -z "$url" ]; then
            echo "::error::deploy-command did not write a URL to \$PREVIEW_URL_FILE"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment the preview link on the pull request
        if: github.event_name == 'pull_request'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker='<!-- oneshot-preview -->'
          body_file=$(mktemp)
          trap 'rm -f "$body_file"' EXIT
          cat > "$body_file" <<BODY
          $marker
          **Preview:** $URL

          Built from \`${HEAD_SHA:0:7}\`.
          BODY
          existing=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -n "$existing" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/$existing" -X PATCH -F body=@"$body_file" >/dev/null
          else
            gh api "repos/${{ github.repository }}/issues/$PR/comments" -F body=@"$body_file" >/dev/null
          fi
          gh api "repos/${{ github.repository }}/statuses/$HEAD_SHA" \
            -f state=success -f context=preview -f description="Preview deployed" -f target_url="$URL"

      - name: Put the link on the job summary
        if: github.event_name == 'push'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "**Preview:** $URL"
          } >> "$GITHUB_STEP_SUMMARY"

  teardown:
    if: github.event.action == 'closed' && inputs.teardown-command != ''
    runs-on: ${{ fromJSON(inputs.runs-on-label) }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the caller's teardown
        env:
          PR: ${{ github.event.pull_request.number }}
        run: ${{ inputs.teardown-command }}
