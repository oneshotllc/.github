name: Comment Gate (reusable)

on:
  workflow_call: {}

permissions:
  issues: write

jobs:
  gate:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.pull_request == null
    steps:
      - name: Recognize state-driving comments deterministically
        uses: actions/github-script@v7
        with:
          script: |
            // Deterministic comment contract gate — no LLM calls. Recognizes a
            // small set of state-driving comment shapes and applies the
            // corresponding label transition. Everything else is ignored.
            const MARKER = "<!-- oneshot-comment-gate -->";
            const issue = context.payload.issue;
            const comment = context.payload.comment;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const author = comment.user.login;

            async function setLabels(add, remove) {
              for (const l of remove) {
                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: l });
                } catch (e) {
                  // label wasn't present — fine
                }
              }
              if (add.length) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: add });
              }
            }

            async function upsertComment(body) {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issue.number });
              const existing = comments.find(c => c.body && c.body.includes(MARKER));
              const full = `${MARKER}\n${body}`;
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: full });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: full });
              }
            }

            const raw = (comment.body || "").trim();
            const lower = raw.toLowerCase();

            if (lower.startsWith("answer:")) {
              const payload = raw.slice("answer:".length).trim();
              if (payload === "") {
                await upsertComment(`@${author} an \`answer:\` comment needs the answer after the colon, e.g.:\n\n\`\`\`\nanswer: <your answer here>\n\`\`\``);
              } else {
                await setLabels(["needs:triage"], ["needs:brian"]);
                console.log("Recognized answer: block. Transitioned needs:brian -> needs:triage.");
              }
              return;
            }

            if (lower === "approved") {
              await setLabels(["approved"], []);
              console.log("Recognized approved. Labeled approved.");
              return;
            }

            if (lower.startsWith("rejected:")) {
              const payload = raw.slice("rejected:".length).trim();
              if (payload === "") {
                await upsertComment(`@${author} a \`rejected:\` comment needs a reason after the colon, e.g.:\n\n\`\`\`\nrejected: <why this is being rejected>\n\`\`\``);
              } else {
                await setLabels(["invalid"], ["approved"]);
                console.log("Recognized rejected: <reason>. Labeled invalid.");
              }
              return;
            }

            if (lower.startsWith("/pull-ticket")) {
              // Existing command, unchanged — handled by other automation.
              console.log("Recognized /pull-ticket command; not this gate's job, ignoring.");
              return;
            }

            // Everything else is inert chatter: allowed, ignored.
            console.log("No recognized comment shape; ignoring silently.");
